<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <!-- Eruda Mobile DevTools -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <!-- On-Screen Error Handler -->
    <script>
      (function() {
        function showErrorOverlay(title, msg, source, lineno, colno, stack) {
          function render() {
            var container = document.getElementById('mobile-debug-error-overlay');
            if (!container) {
              container = document.createElement('div');
              container.id = 'mobile-debug-error-overlay';
              container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);color:#ff4d4d;z-index:999999;padding:16px;box-sizing:border-box;overflow:auto;font-family:monospace;font-size:14px;word-break:break-word;';
              if (document.body) {
                document.body.appendChild(container);
              } else {
                document.addEventListener('DOMContentLoaded', function() {
                  document.body.appendChild(container);
                });
              }
            }
            var errorCard = document.createElement('div');
            errorCard.style.cssText = 'margin-bottom:16px;padding:12px;border:2px solid #ff4d4d;background:#1a0000;border-radius:8px;';
            errorCard.innerHTML = '<h3 style="margin:0 0 8px 0;font-size:16px;color:#ff6666;">' + (title || 'RUNTIME ERROR') + '</h3>' +
              '<div style="font-weight:bold;margin-bottom:6px;font-size:15px;color:#ffffff;">' + (msg || 'Unknown Error') + '</div>' +
              (source ? '<div style="color:#ffb3b3;font-size:12px;margin-bottom:4px;">At: ' + source + (lineno ? ':' + lineno + (colno ? ':' + colno : '') : '') + '</div>' : '') +
              (stack ? '<pre style="margin:8px 0 0 0;white-space:pre-wrap;font-size:11px;color:#ffcccc;max-height:200px;overflow:auto;">' + stack + '</pre>' : '');
            container.appendChild(errorCard);
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', render);
          } else {
            render();
          }
        }

        window.onerror = function(msg, source, lineno, colno, error) {
          var stack = error && error.stack ? error.stack : '';
          showErrorOverlay('JavaScript Error', msg, source, lineno, colno, stack);
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || String(reason)) : 'Unhandled Promise Rejection';
          var stack = reason && reason.stack ? reason.stack : '';
          showErrorOverlay('Unhandled Rejection', msg, '', '', '', stack);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
